# 前端静态资源 + 反向代理 /api、/files。
# upstream 指向服务名 backend：--scale backend=2 时 Docker DNS 返回两个地址，Nginx 在启动时解析并轮询。
upstream backend_upstream {
    server backend:8081;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # SSE：关闭缓冲，否则 Nginx 会攒够一个缓冲区才转发，推送就不"实时"了
    location = /api/notifications/stream {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Trace-Id $request_id;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # 用 $remote_addr 覆盖而不是追加，客户端伪造的 X-Forwarded-For 不会传到后端（限流按 IP 时依赖它）
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Trace-Id $request_id;
    }

    # 接口文档也经 8080 暴露一份，方便只开一个端口时使用
    location ~ ^/(swagger-ui|v3/api-docs) {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
    }

    # 图片：转发到 MinIO 的 bucket，不直接暴露 MinIO 端口
    location /files/ {
        proxy_pass http://minio:9000/code-nest/;
        proxy_set_header Host minio:9000;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Vue Router 的 history 模式：找不到文件时回到 index.html，由前端路由处理
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
