name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # verify 会跑单元测试（surefire，*Test）和集成测试（failsafe，*IT）；
      # 集成测试用 Testcontainers 启动 MySQL、Redis、RabbitMQ，GitHub 的 ubuntu 机器自带 Docker
      - name: Build and test
        run: ./mvnw -B verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/**/target/surefire-reports
            backend/**/target/failsafe-reports

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # build 脚本里先跑 vue-tsc 类型检查，再用 Vite 打包
      - run: npm run build

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 学习文档里的 `路径:行号`（`锚点`）引用：文件要存在、行号不越界、锚点在该行上下 3 行内。
      # 代码改动让行号偏移时在这里失败，提醒同步改学习文档
      - run: python3 scripts/check-learn-refs.py
