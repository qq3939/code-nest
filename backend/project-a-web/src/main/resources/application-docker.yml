# docker：后端和中间件都在 Compose 里，主机名用服务名。
spring:
  datasource:
    url: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true&useSSL=false
  data:
    redis:
      host: redis
  rabbitmq:
    host: rabbitmq
  elasticsearch:
    uris: http://elasticsearch:9200

app:
  minio:
    endpoint: http://minio:9000
  # Compose 环境就是本机实验环境，压测需要切换策略，所以打开；真正上线的 prod 配置里关闭（见 D-016）
  dev-tools:
    enabled: ${DEV_TOOLS_ENABLED:true}
