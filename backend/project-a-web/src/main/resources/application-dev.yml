# dev：后端在本机跑（IDE 或 mvnw），中间件在 Docker Compose 里。
# 直接读取仓库根目录的 .env（格式和 properties 兼容），不用手动 export 环境变量。
spring:
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:../../.env[.properties]
      - optional:file:./.env[.properties]

app:
  dev-tools:
    enabled: true

logging:
  level:
    io.github.changeme.projecta: debug
