# 集成测试专用配置：中间件由 Testcontainers 启动，连接信息在 IntegrationTestBase 里动态注入
spring:
  datasource:
    hikari:
      # 默认配置里取连接 3 秒超时是为了快速失败。CountConcurrencyIT 让 200 个线程抢同一行的行锁，
      # 1000 次更新只能串行；Windows 上 Docker Desktop 的 MySQL 每次提交约 8ms（WSL2 虚拟磁盘刷盘慢），
      # 总共约 8 秒，排在后面的线程 3 秒内拿不到连接（P-021）。测试验证的是计数准不准，不是取连接快不快。
      connection-timeout: 30000
app:
  jwt:
    secret: integration-test-secret-0123456789-abcdefghijklmn
  admin:
    username: admin
    password: admin-password-123
  jobs:
    enabled: false
  dev-tools:
    enabled: true
  mq:
    # 测试里把重试间隔缩短，死信用例几秒内就能跑完
    retry-delays: 200ms,200ms,200ms
  feed:
    big-v-threshold: 3
  search:
    enabled: false
  minio:
    endpoint: http://localhost:1
    access-key: test
    secret-key: test-secret
  # 测试会在同一 IP 下注册大量用户，放宽这些规则；like 保持默认（5 次/秒）用于验证限流
  rate-limit:
    login: { window: 1m, limit: 100000 }
    register: { window: 1m, limit: 100000 }
    comment: { window: 1m, limit: 100000 }
    publish: { window: 1m, limit: 100000 }
    collect: { window: 1s, limit: 100000 }
logging:
  level:
    root: WARN
    io.github.qq3939.codenest: INFO
